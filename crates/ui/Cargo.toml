[package]
name = "harbor-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["full-languages"]
full-languages = ["gpui-kit/tree-sitter-languages"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
gpui-kit.workspace = true
harbor-domain = { path = "../domain" }
harbor-git = { path = "../git" }
harbor-github = { path = "../github" }
harbor-logs = { path = "../logs" }
harbor-sync = { path = "../sync" }
markdown.workspace = true
notify-rust = "4"
tracing.workspace = true
tree-sitter-swift.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
harbor-storage = { path = "../storage" }
