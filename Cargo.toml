[workspace]
members = [
    "crates/app",
    "crates/domain",
    "crates/git",
    "crates/github",
    "crates/logs",
    "crates/storage",
    "crates/sync",
    "crates/ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-lite = "2"
futures = "0.3"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "3a1eaf1583958b38a9e3f5a98eb58d5ab6cc014e", features = [
    "tree-sitter-bash",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-rust",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
gpui_reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.9" }
http = "1"
http-body-util = "0.1"
markdown = "1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
# Use the same AWS-LC backend as the app instead of Octocrab's default RustCrypto JWT backend.
octocrab = { version = "0.54", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "jwt-aws-lc-rs",
    "retry",
    "rustls",
    "rustls-aws-lc-rs",
    "timeout",
    "tracing",
] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-async-std", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tree-sitter-swift = "0.7"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-pre-macos = { opt-level = 3 }
gpui-pre-apple = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-reqwest-client = { opt-level = 3 }
taffy = { opt-level = 3 }
